* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {

.nav { position: fixed; left: 50%; transform: translateX(-50%); bottom: 0; width: 100%; max-width: 480px; z-index: 20; height: calc(76px + env(safe-area-inset-bottom, 0px)); padding: 8px 6px env(safe-area-inset-bottom, 0px); background: var(--surface); border-top: 1px solid var(--line); display: flex; align-items: center; }

.badge { position: absolute; top: -5px; right: 1px; min-width: 19px; height: 19px; padding: 0 5px; border-radius: 10px; background: var(--vit-ink); color: var(--surface); border: 2px solid var(--surface); font-size: 10.5px; font-weight: 800; line-height: 1; display: flex; align-items: center; justify-content: center; }

.fab { position: fixed; z-index: 21; right: max(20px, calc(50vw - 240px + 20px)); bottom: calc(96px + env(safe-area-inset-bottom, 0px)); width: 60px; height: 60px; border-radius: 20px; border: none; background: var(--ink); color: var(--on-ink); display: flex; align-items: center; justify-content: center; box-shadow: var(--shadow); text-decoration: none; }
.mrow { display: flex; align-items: center; gap: 14px; padding: 14px 0; border-bottom: 1px solid var(--line); }
.mrow:last-child { border-bottom: none; }

.mrow.done .title { color: var(--faint); text-decoration: line-through; }

.check[aria-pressed="true"] > span { background: var(--ink); border-color: var(--ink); color: var(--on-ink); }
.dot { width: 8px; height: 8px; border-radius: 4px; display: inline-block; flex-shrink: 0; }

.input:focus { outline: none; border-color: var(--ink); }

.input.big { min-height: 60px; font-size: 18px; font-weight: 600; border: 2px solid var(--ink); border-radius: 20px; }

.stepper { display: flex; align-items: center; justify-content: space-between; padding: 6px; background: var(--soft); border-radius: 18px; }

.stepper .v { font-family: var(--font-display); font-size: 24px; font-weight: 700; }
.switch { position: relative; width: 50px; height: 30px; flex-shrink: 0; }
.switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
.switch span { position: absolute; inset: 0; border-radius: 15px; background: var(--soft-2); transition: background 0.15s; pointer-events: none; }
.switch span::after { content: ''; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 12px; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.2); transition: transform 0.15s; }
.switch input:checked + span { background: var(--ink); }
.switch input:checked + span::after { transform: translateX(20px); }
.sheet-wrap { position: fixed; inset: 0; z-index: 40; display: flex; align-items: flex-end; justify-content: center; }
.sheet-scrim { position: absolute; inset: 0; background: var(--scrim); animation: fade 0.18s ease-out; }
.sheet { position: relative; width: 100%; max-width: 480px; max-height: 92vh; max-height: 92dvh; overflow-y: auto; background: var(--bg); border-radius: 28px 28px 0 0; padding: 10px 20px calc(24px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 20px; animation: rise 0.22s cubic-bezier(.2,.8,.2,1); }

.sos-card { background: var(--emocional-soft); border-color: transparent; color: var(--emocional-ink); }
.prog-dots { display: flex; gap: 6px; }
.prog-dots > i { flex: 1 1 0; height: 8px; border-radius: 4px; background: var(--soft-2); display: block; }
.prog-dots > i.on { background: var(--emocional); }
.prog-dots > i.next { background: var(--emocional-soft); box-shadow: inset 0 0 0 1.5px var(--emocional); }
.prog-dots.sm > i { height: 5px; }
.calm-bars, .wd-bars { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; align-items: end; }
.calm-bars .cb, .wd-bars .cb { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.calm-bars .cb > i, .wd-bars .cb > i { display: block; width: 70%; max-width: 30px; border-radius: 4px 4px 0 0; }
.scale10 { display: grid; grid-template-columns: repeat(auto-fit, minmax(28px, 1fr)); gap: 4px; }
.scale10 button { min-height: 40px; border-radius: 10px; border: 1.5px solid var(--line-2); background: var(--surface); color: var(--ink); font: inherit; font-weight: 800; font-size: 14px; padding: 0; cursor: pointer; }
.scale10 button[aria-pressed="true"] { background: var(--ink); color: var(--on-ink); border-color: var(--ink); }
.trap { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; width: 100%; padding: 10px 14px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); font: inherit; text-align: left; cursor: pointer; }
.trap[aria-pressed="true"] { border-color: var(--emocional); background: var(--emocional-soft); color: var(--emocional-ink); }
.trap[aria-pressed="true"] .muted { color: var(--emocional-ink); }
.emo-def { padding: 8px 12px; border-radius: 12px; background: var(--soft); line-height: 1.4; }
.strat { min-height: 60px; }
.cmp { padding: 4px 0; }
.cmp-row { display: grid; grid-template-columns: 94px 1fr 44px; align-items: center; gap: 8px; }
.cmp-bar { display: block; height: 10px; border-radius: 5px; background: var(--soft); overflow: hidden; }
.cmp-bar > i { display: block; height: 100%; border-radius: 5px; background: var(--emocional); }
.clamp3 { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
.jrow { align-items: flex-start; padding-top: 12px; padding-bottom: 12px; text-align: left; }
.who5 { padding: 4px 0 6px; border-bottom: 1px solid var(--line); }
details > summary { list-style: none; }
details > summary::-webkit-details-marker { display: none; }
.stat-periods { gap: 6px; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin: 0 -2px; padding: 2px; }
.stat-periods::-webkit-scrollbar { display: none; }
.stat-periods .tchip { flex-shrink: 0; }
.kpis3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.kpis3 .kpi-v { font-size: 16px; line-height: 1.2; white-space: nowrap; }
.kpis3.stack { grid-template-columns: 1fr; gap: 6px; }
.kpis3.stack > div { flex-direction: row; justify-content: space-between; align-items: baseline; }
.insight { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 0; background: none; border: 0; color: var(--ink); font: inherit; min-height: 48px; border-top: 1px solid var(--line); }
.insight:first-of-type { border-top: 0; }
.insight:disabled { opacity: 1; cursor: default; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12.5px; font-weight: 700; color: var(--muted); }
.legend > span { display: inline-flex; align-items: center; gap: 6px; }
.legend .sw { display: inline-block; width: 12px; height: 12px; border-radius: 3px; flex-shrink: 0; }
.legend .sw.line { height: 3px; width: 16px; border-radius: 2px; }
.legend .sw.line.dash { background: repeating-linear-gradient(90deg, currentColor 0 5px, transparent 5px 8px) !important; }
.legend .sw.mark { width: 3px; height: 14px; border-radius: 2px; background: var(--ink); }
.sw.s-in { background: var(--series-in); color: var(--series-in); }
.sw.s-out { background: var(--series-out); color: var(--series-out); }
.sw.s-ref { background: var(--muted); color: var(--muted); }
.chart-wrap { position: relative; }
.chart-wrap svg { display: block; overflow: visible; }
.chart-wrap .grid { stroke: var(--line); stroke-width: 1; }
.chart-wrap .axis { font: 600 10.5px Figtree, sans-serif; fill: var(--muted); }
.chart-wrap .strong-axis { fill: var(--ink); font-weight: 700; }
.chart-wrap .ref { stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 4 4; }
.chart-wrap .cross { stroke: var(--line-2); stroke-width: 1.5; }
.chart-wrap .ln { fill: none; stroke-width: 2.25; stroke-linecap: round; stroke-linejoin: round; }
.chart-wrap .ln.dash { stroke-dasharray: 5 4; }
.chart-wrap .ln.dotted { stroke-dasharray: 1.5 4.5; stroke-width: 2.5; }
.legend .sw.line.dot-line { background: repeating-linear-gradient(90deg, currentColor 0 2px, transparent 2px 5px) !important; }
.chart-wrap .ln.s-in { stroke: var(--series-in); }
.chart-wrap .ln.s-out { stroke: var(--series-out); }
.chart-wrap .dot { stroke: var(--surface); stroke-width: 2; }
.chart-wrap .dot.s-in, .chart-wrap .fill.s-in { fill: var(--series-in); }
.chart-wrap .dot.s-out, .chart-wrap .fill.s-out { fill: var(--series-out); }
.chart-wrap .tip { position: absolute; top: 4px; transform: translateX(-10%); background: var(--surface); border: 1px solid var(--line-2); border-radius: 12px; padding: 8px 10px; display: flex; flex-direction: column; gap: 2px; font-size: 12.5px; box-shadow: 0 6px 18px rgba(0, 0, 0, 0.12); pointer-events: none; min-width: 140px; color: var(--ink); }
.chart-wrap .tip span { color: var(--muted); font-weight: 600; }
.table-view summary { font-size: 13px; font-weight: 700; color: var(--muted); cursor: pointer; min-height: 32px; display: flex; align-items: center; }
.table-view table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 6px; }
.table-view th, .table-view td { text-align: right; padding: 6px 4px; border-bottom: 1px solid var(--line); }
.table-view th:first-child, .table-view td:first-child { text-align: left; }
.hbar { display: block; height: 8px; border-radius: 4px; background: var(--soft); overflow: hidden; }
.hbar > i { display: block; height: 100%; border-radius: 0 4px 4px 0; background: var(--finanzas); }
.cat-stat { min-height: 72px; align-items: stretch; }
.cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.cal-h { text-align: center; font-size: 11.5px; font-weight: 700; color: var(--muted); padding-bottom: 2px; }
.cal-d { aspect-ratio: 1 / 1; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; }
.cal-d.today { box-shadow: 0 0 0 2px var(--ink); }
.heat-0 { background: var(--soft); color: var(--muted); }
.heat-f { background: transparent; color: var(--faint, var(--muted)); border: 1px dashed var(--line-2); }
.heat-1 { background: var(--heat-1); color: var(--heat-ink-1); }
.heat-2 { background: var(--heat-2); color: var(--heat-ink-2); }
.heat-3 { background: var(--heat-3); color: var(--heat-ink-3); }
.heat-4 { background: var(--heat-4); color: var(--heat-ink-4); }
.heat-5 { background: var(--heat-5); color: var(--heat-ink-5); }
.cal-key { display: inline-block; width: 16px; height: 12px; border-radius: 3px; }
.proj-bar { position: relative; display: flex; gap: 2px; height: 14px; border-radius: 7px; background: var(--soft); overflow: visible; }
.proj-bar > i { display: block; height: 100%; min-width: 0; }
.proj-bar > i:first-child { border-radius: 7px 0 0 7px; }
.proj-bar > b { position: absolute; top: -5px; width: 3px; height: 24px; margin-left: -1.5px; border-radius: 2px; background: var(--ink); }
.pb-spent { background: var(--series-out); }
.pb-fixed { background: var(--series-out); opacity: 0.55; }
.pb-daily { background: repeating-linear-gradient(45deg, var(--series-out) 0 3px, transparent 3px 7px); }
.legend .sw.pb-daily { box-shadow: inset 0 0 0 1px var(--series-out); }
.bud-hist { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; align-items: end; }
.bud-hist .cb { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.bud-hist .bh-col { position: relative; width: 60%; max-width: 28px; height: 72px; display: flex; align-items: flex-end; box-shadow: 0 1.5px 0 var(--line); }
.bud-hist .bh-col > i { display: block; width: 100%; border-radius: 4px 4px 0 0; background: var(--finanzas); }
.bud-hist .bh-col > b { position: absolute; left: -4px; right: -4px; height: 2px; border-radius: 1px; background: var(--ink); }
.map-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.map-grid select.input { padding-right: 8px; }

</style>

rte de aprender; lo caro es no aprender.",""],["Diez p\xE1ginas al d\xEDa son casi quince libros al a\xF1o.",""],["La curiosidad es el motor de todo aprendizaje.",""],["Ense\xF1ar lo que sabes es aprenderlo dos veces.",""],["Cada experto fue una vez un principiante que no se rindi\xF3.",""],["Pregunta sin miedo: la duda que callas no se resuelve.",""],["Lo que repasas a tiempo se queda contigo.",""],["No compares tu cap\xEDtulo uno con el cap\xEDtulo veinte de otro.",""],["Aprender cambia tu manera de mirar, y mirar distinto cambia tus resultados.",""],["Un idioma nuevo es una ventana nueva.",""],["El conocimiento que no se usa se oxida.",""],["Antes de dormir, preg\xFAntate: \xBFqu\xE9 aprend\xED hoy?",""],["Toma notas: la memoria olvida, el papel recuerda.",""],["La mejor inversi\xF3n es la que haces en tu propia cabeza.",""],["Si no te reta, no te cambia.",""],["La claridad llega haciendo, no solo pensando.",""],["Las buenas ideas llegan cuando les dejas espacio.",""],["Un presupuesto no te limita: le dice a tu dinero ad\xF3nde ir.",""],["P\xE1gate primero: ahorra antes de gastar, no lo que sobre.",""],["Los gastos peque\xF1os repetidos son gastos grandes disfrazados.",""],["Comprar con calma es ahorrar sin esfuerzo.",""],["La deuda m\xE1s cara se paga primero; la paz llega despu\xE9s.",""],["Lo que no anotas no lo puedes mejorar.",""],["Antes de comprar, preg\xFAntate: \xBFlo necesito o solo lo quiero ahora?",""],["Un fondo de emergencia convierte las crisis en simples imprevistos.",""],["Gana m\xE1s, s\xED, pero sobre todo gasta mejor.",""],["La libertad financiera empieza con un h\xE1bito, no con una fortuna.",""],["Revisa tus gastos sin culpa: los n\xFAmeros informan, no juzgan.",""],["Esperar 24 horas antes de una compra grande ahorra muchos arrepentimientos.",""],["El inter\xE9s compuesto premia a quien empieza temprano y no se detiene.",""],["No compares tu cartera con la vitrina de otros.",""],["Cada peso con un prop\xF3sito: as\xED se construye la tranqu  los ojos cuando quieras."]]},{id:"gratitud",title:"Gratitud",minutes:5,icon:"gift",desc:"Recordar con detalle lo bueno de tu d\xEDa, de tu gente y de tu cuerpo.",steps:[[0,"Acom\xF3date y haz unas respiraciones tranquilas."],[20,"Trae a tu mente algo de hoy, aunque sea peque\xF1o, que te hizo bien."],[60,"Recuerda los detalles: d\xF3nde estabas, qui\xE9n estaba, qu\xE9 sentiste."],[110,"Ahora piensa en una persona que hace tu vida mejor. \xBFQu\xE9 es lo que valoras de ella?"],[170,"Piensa en algo de tu cuerpo o de tu salud que te sostiene cada d\xEDa."],[220,"Nota c\xF3mo se siente la gratitud en el cuerpo. Qu\xE9date con esa sensaci\xF3n."],[270,"Si quieres, despu\xE9s anota tres cosas buenas en tu diario. Abre los ojos cuando quieras."]]},{id:"dormir",title:"Relajaci\xF3n para dormir",minutes:10,icon:"bed",desc:"Tensa y suelta cada parte del cuerpo para llegar al sue\xF1o m\xE1s suelto.",steps:[[0,"Acu\xE9state en tu cama y apaga lo que puedas. Vas a tensar y soltar cada parte del cuerpo."],[20,"Respira hondo por la nariz y suelta el aire lento por la boca. Otra vez."],[45,"Aprieta los pies, encogiendo los dedos, cinco segundos\u2026 y suelta. Siente la diferencia."],[85,"Tensa las piernas, apretando los muslos\u2026 y suelta."],[125,"Aprieta los gl\xFAteos y la barriga\u2026 y suelta."],[165,"Cierra los pu\xF1os con fuerza\u2026 y suelta. Deja las manos pesadas."],[205,"Sube los hombros hacia las orejas\u2026 y d\xE9jalos caer."],[245,"Arruga la cara: ojos, frente, nariz\u2026 y suelta. Afloja la mand\xEDbula."],[290,"Ahora todo el cuerpo est\xE1 m\xE1s suelto. Respira despacio, con la exhalaci\xF3n m\xE1s larga."],[350,"Imagina un lugar donde te sientes a salvo. Mira sus colores, escucha sus sonidos."],[430,"Con cada exhalaci\xF3n te hundes un poco m\xE1s en la cama."],[500,"No tienes que hacer nada m\xE1s. Puedes quedarte as\xED y dejar que llegue el sue\xF1o."]]},{id:"caminar",title:"Caminar con atenci\xF3n",minutes:6,icon:"pulse",desc:"Una meditaci\xF3n en function salida(o) {
  return ContentService.createTextOutput(JSON.stringify(o)).setMimeType(ContentService.MimeType.JSON);
}

// Carpeta \xABAstra\xBB: la de esta hoja si el script est\xE1 dentro de ella; si no, una carpeta \xABAstra\xBB tuya (o una nueva).
function carpeta() {
  var props = PropertiesService.getScriptProperties();
  var id = props.getProperty('CARPETA');
  if (id) { try { return DriveApp.getFolderById(id); } catch (e) {} }
  var f = null;
  try {
    var ss = SpreadsheetApp.getActiveSpreadsheet();
    if (ss) { var ps = DriveApp.getFileById(ss.getId()).getParents(); if (ps.hasNext()) f = ps.next(); }
  } catch (e) {}
  if (!f) {
    var yo = Session.getEffectiveUser().getEmail();
    var it = DriveApp.getFoldersByName('Astra');
    while (it.hasNext()) { var c = it.next(); try { if (c.getOwner() && c.getOwner().getEmail() === yo) { f = c; break; } } catch (e) {} }
    if (!f) f = DriveApp.createFolder('Astra');
  }
  props.setProperty('CARPETA', f.getId());
  return f;
}

function sub(nombre, padre) {
  var p = padre || carpeta();
  var it = p.getFoldersByName(nombre);
  return it.hasNext() ? it.next() : p.createFolder(nombre);
}

function archivoDatos() {
  var it = carpeta().getFilesByName(DATOS);
  return it.hasNext() ? it.next() : null;
}

function estado() {
  var p = PropertiesService.getScriptProperties();
  return { rev: Number(p.getProperty('REV') || 0), updated: p.getProperty('UPDATED') || null, device: p.getProperty('DEVICE') || null };
}

function leer() {
  var f = archivoDatos();
  return f ? f.getBlob().getDataAsString('UTF-8') : null;
}

function guardar(b) {
  var st = estado();
  if (b.expect !== null && b.expect !== undefined && Number(b.expect) !== st.rev) return { ok: false, conflicto: true, rev: st.rev };
  var texto = String(b.data || '');
  if (!texto) return { ok: false, error: 'vacio' };
  var f = archivoDatos();
  if (f) f.setContent(texto); else carpeta().createFile(DATOS, texto, 'application/json');
  var rev = st.rev + 1;
  var ahora = new Date().toISOString();
  PropertiesService.getScriptProperties().setProperties({ REV: String(rev), UPDATED: ahora, DEVICE: String(b.device || '') });
  respaldo(texto);
  if (b.tablas) { try { tablas(b.tablas); } catch (e) {} }
  return { ok: true, rev: rev, updated: ahora };
}

// Una copia por d\xEDa en \xABRespaldos\xBB; se guardan los \xFAltimos 30 d\xEDas.
function respaldo(texto) {
  var r = sub('Respaldos');
  var dia = Utilities.formatDate(new Date(), Session.getScriptTimeZone(), 'yyyy-MM-dd');
  var nombre = 'astra-' + dia + '.json';
  var it = r.getFilesByName(nombre);
  if (it.hasNext()) it.next().setContent(texto); else r.createFile(nombre, texto, 'application/json');
  var todos = [];
  var all = r.getFiles();
  while (all.hasNext()) todos.push(all.next());
  todos.sort(function (a, b) { return a.getName() < b.getName() ? 1 : -1; });
  todos.slice(30).forEach(function (x) { x.setTrashed(true); });
}

function hoja() {
  try { var activa = SpreadsheetApp.getActiveSpreadsheet(); if (activa) return activa; } catch (e) {}
  var props = PropertiesService.getScriptProperties();
  var id = props.getProperty('HOJA');
  if (id) { try { return SpreadsheetApp.openById(id); } catch (e) {} }
  var it = carpeta().getFilesByName(HOJA);
  var ss;
  if (it.hasNext()) ss = SpreadsheetApp.open(it.next());
  else { ss = SpreadsheetApp.create(HOJA); DriveApp.getFileById(ss.getId()).moveTo(carpeta()); }
  props.setProperty('HOJA', ss.getId());
  return ss;
}

// Tablas legibles: Astra las rehace en cada sincronizaci\xF3n (no las edites a mano).
function tablas(t) {
  var ss = hoja();
  Object.keys(t).forEach(function (nombre) {
    var filas = t[nombre];
    if (!filas || !filas.length) return;
    var sh = ss.getSheetByName(nombre);
    if (!sh) { sh = ss.insertSheet(nombre); sh.getRange(1, 1, 1, filas[0].length).setFontWeight('bold'); sh.setFrozenRows(1); }
    sh.clearContents();
    sh.getRange(1, 1, filas.length, filas[0].length).setValues(filas);
  });
  var vacia = ss.getSheetByName('Hoja 1') || ss.getSheetByName('Sheet1');
  if (vacia && ss.getSheets().length > 1 && vacia.getLastRow() === 0) ss.deleteSheet(vacia);
}

function dentroDe(file, folder) {
  var ps = file.getParents();
  while (ps.hasNext()) {
    var p = ps.next();
    if (p.getId() === folder.getId()) return true;
    var up = p.getParents();
    while (up.hasNext()) if (up.next().getId() === folder.getId()) return true;
  }
  return false;
}

function subirFoto(b) {
  var fotos = sub('Fotos');
  var destino = b.kind ? sub(String(b.kind), fotos) : fotos;
  var blob = Utilities.newBlob(Utilities.base64Decode(b.b64), b.mime || 'image/jpeg', b.name || ('foto-' + b.id + '.jpg'));
  var f = destino.createFile(blob);
  if (b.desc) f.setDescription(String(b.desc));
  return { ok: true, fileId: f.getId() };
}

function leerFoto(b) {
  var f = DriveApp.getFileById(b.fileId);
  if (!dentroDe(f, sub('Fotos'))) return { ok: false, error: 'fuera' };
  var blob = f.getBlob();
  return { ok: true, mime: blob.getContentType(), b64: Utilities.base64Encode(blob.getBytes()) };
}

function borrarFoto(b) {
  try { var f = DriveApp.getFileById(b.fileId); if (dentroDe(f, sub('Fotos'))) f.setTrashed(true); } catch (e) {}
  return { ok: true };
}

function reiniciarClave() {
  PropertiesService.getScriptProperties().deleteProperty('CLAVE');
  Logger.log('Listo. Vuelve a conectar desde Astra con la direcci\xF3n del conector.');
}
