.kpi { background: var(--surface); border: 1.5px solid var(--line); border-radius: 18px; padding: 12px; display: flex; flex-direction: column; gap: 2px; }
.kpi .v { font-family: var(--font-display); font-size: 22px; font-weight: 800; }
.kpi .l { font-size: 12px; color: var(--muted); font-weight: 600; }
.receipt-thumb { width: 64px; height: 84px; border-radius: 10px; object-fit: cover; background: var(--soft); flex-shrink: 0; }
.dfield { display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 52px; padding: 0 14px; border-radius: 14px; }
.dfield.doubt { background: var(--xp-soft); }
.dfield input { width: 55%; text-align: right; border: none; background: transparent; font-size: 15px; font-weight: 700; color: var(--ink); min-height: 44px; }
.dfield input:focus { outline: 2px solid var(--ene); border-radius: 8px; }
.skeleton { background: linear-gradient(90deg, var(--soft) 25%, var(--soft-2) 50%, var(--soft) 75%); background-size: 200% 100%; animation: shimmer 1.2s infinite; border-radius: 10px; }
@keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
